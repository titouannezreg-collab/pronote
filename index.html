<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e0e12">
  <title>Mes Devoirs</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
  --bg: #0e0e12;
  --surface: #16161c;
  --surface2: #1e1e26;
  --border: #2a2a35;
  --text: #e8e8f0;
  --muted: #6b6b80;
  --accent: #f0e6c8;
  --math:    #f97316;
  --french:  #3b82f6;
  --history: #a855f7;
  --physics: #10b981;
  --english: #ec4899;
  --bio:     #22d3ee;
  --other:   #94a3b8;
  --radius: 14px;
  --radius-sm: 10px;
  --nav-h: 68px;
  --sheet-radius: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + 16px);
  overscroll-behavior: none;
}

body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0;
}

.page { max-width: 680px; margin: 0 auto; padding: 28px 16px 16px; position: relative; z-index: 1; }

/* ── Header ── */
header { margin-bottom: 20px; }
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); letter-spacing: -0.02em; }

.header-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  font-family: 'DM Mono', monospace; font-size: 0.68rem;
  color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px;
}

/* ── Stats ── */
.stats {
  display: flex; gap: 0; margin-bottom: 20px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.stat { flex: 1; text-align: center; padding: 14px 8px; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat-value { font-family: 'DM Mono', monospace; font-size: 1.6rem; font-weight: 500; color: var(--accent); }
.stat-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* ── Filters ── */
.filters-wrap { overflow-x: auto; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
.filters-wrap::-webkit-scrollbar { display: none; }
.filters { display: flex; gap: 8px; width: max-content; padding-bottom: 2px; }
.filter-pill {
  padding: 7px 16px; border-radius: 99px; font-size: 0.8rem; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-family: 'DM Sans', sans-serif; white-space: nowrap;
  transition: all 0.15s;
}
.filter-pill.active { background: var(--surface2); color: var(--text); }

/* ── Day groups ── */
.day-group { margin-bottom: 28px; }
.day-label { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.day-label-text { border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px; }
.day-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.devoirs-list { display: flex; flex-direction: column; gap: 10px; }

/* ── Devoir card ── */
.devoir-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--subject-color, var(--other));
  border-radius: var(--radius); padding: 14px 16px;
  display: grid; grid-template-columns: auto 1fr;
  gap: 12px; align-items: start;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.devoir-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--subject-color, var(--other));
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
  margin-top: 1px;
}
.devoir-check:active { background: rgba(239,68,68,0.2); border-color: #ef4444; }
.check-icon { display: none; }

.devoir-subject { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--subject-color, var(--other)); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dst-badge { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: rgba(239,68,68,0.15); color: #ef4444; }

.devoir-line { font-size: 0.88rem; line-height: 1.55; color: var(--text); }
.devoir-line + .devoir-line { margin-top: 3px; }

/* ── Links on card ── */
.devoir-links { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.devoir-link-item {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.8rem; color: var(--subject-color, var(--other));
  text-decoration: none; background: rgba(255,255,255,0.04);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; width: fit-content;
}
.devoir-link-item svg { flex-shrink: 0; opacity: 0.7; }

/* ── Card meta + actions ── */
.devoir-meta { font-size: 0.7rem; color: var(--muted); margin-top: 10px; font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.urgency-badge { font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 4px; }
.urgency-today { background: rgba(239,68,68,0.15); color: #ef4444; }
.urgency-soon  { background: rgba(249,115,22,0.15); color: #f97316; }
.urgency-later { background: rgba(148,163,184,0.1); color: var(--muted); }

.card-actions { display: flex; gap: 6px; margin-top: 10px; }
.card-action-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.72rem; font-family: 'DM Mono', monospace; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.card-action-btn:active { color: var(--accent); border-color: var(--accent); }

.dst-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 4px; background: rgba(239,68,68,0.15); color: #ef4444; }

/* ── Empty ── */
.empty { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
.empty-icon { font-size: 2.5rem; margin-bottom: 16px; opacity: 0.4; }

/* ── Buttons ── */
.btn { padding: 14px 20px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:active { opacity: 0.85; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:active { border-color: var(--text); color: var(--text); }
.btn.full { width: 100%; text-align: center; }

.icon-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; color: var(--muted); cursor: pointer;
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; transition: color 0.15s;
}
.icon-btn:active { color: var(--accent); }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  z-index: 100; padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 0.65rem; font-weight: 500;
  padding: 8px 16px; border-radius: 10px; transition: color 0.15s;
  min-width: 60px;
}
.nav-btn.active { color: var(--accent); }
.nav-btn:active { color: var(--accent); }

/* ── Sheets (bottom drawers) ── */
.sheet-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  z-index: 200;
}
.sheet-overlay.open { display: block; }

.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
  z-index: 201; padding: 0 16px 32px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 90vh; overflow-y: auto;
  padding-bottom: calc(32px + env(safe-area-inset-bottom));
}
.sheet.open { transform: translateY(0); }
.sheet-sm { max-height: 70vh; }

.sheet-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 99px; margin: 12px auto 16px;
}

.sheet-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.sheet-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--accent); }

.sheet-body { margin-bottom: 16px; }

.sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

.sheet textarea {
  width: 100%; min-height: 140px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  padding: 14px; outline: none; resize: vertical; transition: border-color 0.15s;
  line-height: 1.6; margin-bottom: 8px;
}
.sheet textarea:focus { border-color: var(--accent); }
.sheet textarea::placeholder { color: var(--muted); }

.import-feedback { font-size: 0.8rem; font-family: 'DM Mono', monospace; text-align: center; }
.import-feedback.ok { color: #10b981; }
.import-feedback.err { color: #ef4444; }

/* ── Modal label ── */
.modal-label { display: block; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }

/* ── Link rows ── */
.link-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; position: relative; }
.link-row input {
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
  padding: 6px 0; outline: none; width: 100%;
}
.link-row input:last-of-type { border-bottom: none; }
.link-row input::placeholder { color: var(--muted); }
.link-loader { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
.link-remove {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 4px; font-size: 0.9rem;
}
.link-remove:active { color: #ef4444; }

.add-link-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.82rem; color: var(--muted); font-family: 'DM Sans', sans-serif;
  background: none; border: 1px dashed var(--border); border-radius: var(--radius-sm);
  padding: 10px 16px; cursor: pointer; width: 100%; justify-content: center;
  margin-top: 4px;
}
.add-link-btn:active { border-color: var(--accent); color: var(--accent); }

/* ── Calendrier ── */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month-label { font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
.cal-nav { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.3rem; padding: 4px 12px; border-radius: 8px; }
.cal-nav:active { background: var(--surface2); color: var(--accent); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 8px; }
.cal-day-name { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); text-align: center; padding: 6px 0; }
#calDays { display: contents; }

.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; font-family: 'DM Mono', monospace;
  border-radius: 8px; cursor: pointer; color: var(--text);
  border: none; background: none; transition: background 0.1s;
}
.cal-day:active { background: var(--surface2); }
.cal-day.today { color: var(--accent); font-weight: 700; }
.cal-day.selected { background: var(--accent); color: var(--bg); font-weight: 700; }
.cal-day.other-month { color: var(--muted); opacity: 0.35; }
.cal-day.has-devoir { position: relative; }
.cal-day.has-devoir::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cal-day.selected::after { background: var(--bg); }

  </style>
</head>
<body>

<!-- Contenu principal -->
<div class="page" id="pageMain">
  <header>
    <div class="header-row">
      <h1>Mes Devoirs</h1>
      <button class="icon-btn" onclick="openImportSheet()" title="Importer">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 16l-4-4-4 4M12 12V21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
      </button>
    </div>
    <div class="header-meta">
      <span class="pill" id="dateToday"></span>
      <span class="pill">Colle ton Pronote, le reste se fait tout seul.</span>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" id="statToday">0</div><div class="stat-label">Aujourd'hui</div></div>
    <div class="stat"><div class="stat-value" id="statUrgent">0</div><div class="stat-label">Urgents</div></div>
  </div>

  <div class="filters-wrap">
    <div class="filters" id="filters"></div>
  </div>

  <div id="devoirsList"></div>
</div>

<!-- Bottom nav bar -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="setFilter('all')" id="navAll">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span>Tout</span>
  </button>
  <button class="nav-btn" onclick="openImportSheet()" id="navImport">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 16l-4-4-4 4M12 12V21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
    <span>Importer</span>
  </button>
  <button class="nav-btn" onclick="exportDevoirs()" id="navExport">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 8l4 4 4-4M12 12V3"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
    <span>Exporter</span>
  </button>
  <button class="nav-btn" onclick="importDevoirs()" id="navLoad">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span>Charger</span>
  </button>
</nav>

<!-- Sheet : import Pronote -->
<div class="sheet-overlay" id="importSheetOverlay" onclick="closeImportSheet()"></div>
<div class="sheet" id="importSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title">Importer depuis Pronote</span>
    <button class="icon-btn" onclick="closeImportSheet()">✕</button>
  </div>
  <textarea id="pronoteInput" placeholder="Colle ici le texte copié depuis Pronote…"></textarea>
  <div class="sheet-actions">
    <button class="btn btn-primary full" onclick="importPronote()">Importer</button>
    <button class="btn btn-ghost full" onclick="clearAll()">Tout effacer</button>
    <span class="import-feedback" id="importFeedback"></span>
  </div>
</div>

<!-- Sheet : modifier un devoir -->
<div class="sheet-overlay" id="editSheetOverlay" onclick="closeEditModal()"></div>
<div class="sheet" id="editSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="editModalTitle">Modifier</span>
    <button class="icon-btn" onclick="closeEditModal()">✕</button>
  </div>
  <div class="sheet-body">
    <label class="modal-label">Énoncé</label>
    <textarea id="editLines" placeholder="Une ligne par item…"></textarea>

    <label class="modal-label" style="margin-top:16px">Liens</label>
    <div id="editLinks"></div>
    <button class="add-link-btn" onclick="addLinkRow()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Ajouter un lien
    </button>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-primary full" onclick="saveEdit()">Enregistrer</button>
    <button class="btn btn-ghost full" onclick="closeEditModal()">Annuler</button>
  </div>
</div>

<!-- Sheet : calendrier -->
<div class="sheet-overlay" id="calSheetOverlay" onclick="closeDatePopup()"></div>
<div class="sheet sheet-sm" id="calSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title">Déplacer au…</span>
    <button class="icon-btn" onclick="closeDatePopup()">✕</button>
  </div>
  <div class="cal-header">
    <button class="cal-nav" id="calPrev">‹</button>
    <span class="cal-month-label" id="calMonthLabel"></span>
    <button class="cal-nav" id="calNext">›</button>
  </div>
  <div class="cal-grid">
    <div class="cal-day-name">L</div><div class="cal-day-name">M</div>
    <div class="cal-day-name">M</div><div class="cal-day-name">J</div>
    <div class="cal-day-name">V</div><div class="cal-day-name">S</div>
    <div class="cal-day-name">D</div>
    <div id="calDays"></div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-ghost full" onclick="closeDatePopup()">Annuler</button>
  </div>
</div>

<script>
  // ── Constantes ────────────────────────────────────────────────────────────────

const SUBJECT_COLORS = {
  math:    'var(--math)',
  french:  'var(--french)',
  history: 'var(--history)',
  physics: 'var(--physics)',
  english: 'var(--english)',
  bio:     'var(--bio)',
  other:   'var(--other)',
};

const SUBJECT_LABELS = {
  math:    'Maths',
  french:  'Français',
  history: 'Histoire-Géo',
  physics: 'Physique-Chimie',
  english: 'Anglais',
  bio:     'SVT',
  other:   'Autre',
};

const SUBJECT_MAP = [
  { keys: ['math'],                                                                        id: 'math'    },
  { keys: ['français', 'francais', 'french'],                                             id: 'french'  },
  { keys: ['histoire', 'géographie', 'geographie', 'histoire-geo'],                      id: 'history' },
  { keys: ['physique', 'chimie'],                                                          id: 'physics' },
  { keys: ['anglais', 'lv1', 'lv2', 'english'],                                          id: 'english' },
  { keys: ['svt', 'sciences vie', 'biologie', 'bio', 'sciences & vie', 'sciences vie & terre'], id: 'bio' },
];

const MONTHS_FR = {
  janvier:1, février:2, mars:3, avril:4, mai:5, juin:6,
  juillet:7, août:8, septembre:9, octobre:10, novembre:11, décembre:12,
};

const MONTHS_LABELS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

const SKIP_RX = [
  /^donné le /i, /^\[?\d+ jours?\]?$/i, /^non fait$/i,
  /^j'ai terminé$/i, /^voir le cours$/i, /^fait$/i, /^evaluation\s*$/i,
];

// ── État ──────────────────────────────────────────────────────────────────────

let devoirs = JSON.parse(localStorage.getItem('devoirs_v2') || '[]');
devoirs = devoirs.map(d => ({ ...d, id: Math.round(d.id) }));
devoirs = devoirs.filter((d, i, arr) => arr.findIndex(x => x.id === d.id) === i);

let activeFilter = 'all';
let editingId    = null;
let editingDevoir = null;
let calYear = null, calMonth = null, calSelectedDate = null;

function save() { localStorage.setItem('devoirs_v2', JSON.stringify(devoirs)); }

// ── Helpers ───────────────────────────────────────────────────────────────────

function detectSubject(raw) {
  const lower = raw.toLowerCase();
  for (const { keys, id } of SUBJECT_MAP) {
    if (keys.some(k => lower.includes(k))) return id;
  }
  return 'other';
}

function resolveDate(dayNum, monthName) {
  const month = MONTHS_FR[monthName.toLowerCase()];
  if (!month) return null;
  const day = parseInt(dayNum, 10);
  const now = new Date();
  let year = now.getFullYear();
  const candidate = new Date(year, month - 1, day);
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  yesterday.setHours(0, 0, 0, 0);
  if (candidate < yesterday) year += 1;
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function urgency(dateStr) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due   = new Date(dateStr + 'T00:00:00'); due.setHours(0, 0, 0, 0);
  const diff  = Math.round((due - today) / 86400000);
  if (diff <= 0) return { label: "Aujourd'hui", cls: 'urgency-today' };
  if (diff <= 2) return { label: 'Bientôt',     cls: 'urgency-soon'  };
  return { label: `J+${diff}`, cls: 'urgency-later' };
}

function formatDateLong(str) {
  return new Date(str + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function isDST(lines) {
  return lines.some(l => /\bDST\b|devoir\s+sur\s+table|évaluation\s+tp/i.test(l));
}

function escHtml(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getYouTubeID(url) {
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

// ── Parser Pronote ─────────────────────────────────────────────────────────────

function parsePronote(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const results = [];
  let currentDate = null, currentSubjectRaw = null, currentLines = [];

  function flush() {
    if (!currentDate || !currentSubjectRaw || currentLines.length === 0) return;
    results.push({
      id: Date.now() + Math.floor(Math.random() * 10000),
      date: currentDate,
      matiere: detectSubject(currentSubjectRaw),
      matiereRaw: currentSubjectRaw,
      lines: [...currentLines],
      links: [],
      done: false,
    });
    currentLines = [];
  }

  for (const line of lines) {
    const dateMatch = line.match(/pour\s+(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})\s+(\w+)/i);
    if (dateMatch) {
      flush(); currentSubjectRaw = null;
      currentDate = resolveDate(dateMatch[1], dateMatch[2]);
      continue;
    }
    const cleaned = line.replace(/^\*+\s*/, '').trim();
    const isMat = /^[A-ZÀÂÄÉÈÊËÎÏÔÙÛÜÇŒÆ\s\-&'0-9LV]+$/.test(cleaned)
      && cleaned.length >= 3 && cleaned.length < 65
      && !SKIP_RX.some(rx => rx.test(cleaned));
    if (isMat && currentDate) { flush(); currentSubjectRaw = cleaned; continue; }
    if (SKIP_RX.some(rx => rx.test(cleaned))) continue;
    if (currentDate && currentSubjectRaw && cleaned) currentLines.push(cleaned);
  }
  flush();
  return results;
}

// ── Import Pronote ─────────────────────────────────────────────────────────────

function openImportSheet() {
  document.getElementById('importSheetOverlay').classList.add('open');
  document.getElementById('importSheet').classList.add('open');
}

function closeImportSheet() {
  document.getElementById('importSheetOverlay').classList.remove('open');
  document.getElementById('importSheet').classList.remove('open');
}

function importPronote() {
  const text = document.getElementById('pronoteInput').value;
  const parsed = parsePronote(text);
  const fb = document.getElementById('importFeedback');
  if (parsed.length === 0) {
    fb.textContent = 'Aucun devoir détecté.';
    fb.className = 'import-feedback err';
    return;
  }
  let added = 0;
  for (const p of parsed) {
    const key = p.date + p.matiere + (p.lines[0] || '');
    if (!devoirs.some(d => d.date + d.matiere + (d.lines[0] || '') === key)) {
      devoirs.push(p); added++;
    }
  }
  save(); render();
  fb.textContent = `${added} devoir(s) importé(s).`;
  fb.className = 'import-feedback ok';
  document.getElementById('pronoteInput').value = '';
  setTimeout(() => { closeImportSheet(); fb.textContent = ''; }, 1500);
}

function clearAll() {
  if (!confirm('Effacer tous les devoirs ?')) return;
  devoirs = []; save(); render(); closeImportSheet();
}

// ── Export / Import JSON ───────────────────────────────────────────────────────

function exportDevoirs() {
  const blob = new Blob([JSON.stringify(devoirs, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'devoirs-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importDevoirs() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.addEventListener('change', () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error();
        let added = 0;
        imported.forEach(d => {
          if (!devoirs.some(x => x.id === d.id)) { devoirs.push(d); added++; }
        });
        save(); render();
      } catch { alert('Fichier invalide.'); }
    };
    reader.readAsText(file);
  });
  input.click();
}

// ── Filtres ────────────────────────────────────────────────────────────────────

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (f === 'all') document.getElementById('navAll').classList.add('active');
  render();
}

// ── Edit modal (sheet) ────────────────────────────────────────────────────────

function openEditModal(id) {
  editingDevoir = devoirs.find(x => x.id === Number(id));
  if (!editingDevoir) return;
  document.getElementById('editModalTitle').textContent = editingDevoir.matiereRaw || SUBJECT_LABELS[editingDevoir.matiere];
  document.getElementById('editLines').value = editingDevoir.lines.join('\n');
  renderLinkRows(editingDevoir.links || []);
  document.getElementById('editSheetOverlay').classList.add('open');
  document.getElementById('editSheet').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editSheetOverlay').classList.remove('open');
  document.getElementById('editSheet').classList.remove('open');
  editingDevoir = null;
}

function saveEdit() {
  if (!editingDevoir) return;
  editingDevoir.lines = document.getElementById('editLines').value.split('\n').map(l => l.trim()).filter(Boolean);
  editingDevoir.links = collectLinks();
  save(); render(); closeEditModal();
}

// ── Liens ─────────────────────────────────────────────────────────────────────

function renderLinkRows(links) {
  const container = document.getElementById('editLinks');
  container.innerHTML = '';
  links.forEach((lk, i) => container.appendChild(makeLinkRow(lk.label, lk.url, i)));
}

function makeLinkRow(label, url, idx) {
  const row = document.createElement('div');
  row.className = 'link-row';
  row.dataset.idx = idx;

  const labelInput = document.createElement('input');
  labelInput.type = 'text'; labelInput.placeholder = 'Nom du lien';
  labelInput.value = label || ''; labelInput.dataset.field = 'label';

  const urlInput = document.createElement('input');
  urlInput.type = 'url'; urlInput.placeholder = 'Colle une URL…';
  urlInput.value = url || ''; urlInput.dataset.field = 'url';

  const loader = document.createElement('span');
  loader.className = 'link-loader'; loader.textContent = '…'; loader.hidden = true;

  const removeBtn = document.createElement('button');
  removeBtn.className = 'link-remove'; removeBtn.textContent = '✕';
  removeBtn.addEventListener('click', () => row.remove());

  urlInput.addEventListener('blur', () => fetchLinkTitle(urlInput, labelInput, loader));
  urlInput.addEventListener('paste', () => setTimeout(() => fetchLinkTitle(urlInput, labelInput, loader), 50));

  row.appendChild(removeBtn);
  row.appendChild(labelInput);
  row.appendChild(loader);
  row.appendChild(urlInput);
  return row;
}

async function fetchLinkTitle(urlInput, labelInput, loader) {
  const url = urlInput.value.trim();
  if (!url || labelInput.value.trim()) return;
  if (!url.startsWith('http')) return;

  if (url.includes('lumni.fr')) {
    const slug = url.split('/').filter(Boolean).pop().split('?')[0];
    if (slug) labelInput.value = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return;
  }

  loader.hidden = false;
  try {
    const ytId = getYouTubeID(url);
    if (ytId) {
      const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
      if (res.ok) { const data = await res.json(); labelInput.value = data.title; loader.hidden = true; return; }
    }
    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
    if (res.ok) {
      const data = await res.json();
      const match = data.contents.match(/<title[^>]*>([^<]+)<\/title>/i);
      if (match) labelInput.value = match[1].trim().slice(0, 80);
    }
  } catch { /* silencieux */ } finally { loader.hidden = true; }
}

function addLinkRow() {
  const container = document.getElementById('editLinks');
  const row = makeLinkRow('', '', container.children.length);
  container.appendChild(row);
  row.querySelector('[data-field="url"]').focus();
}

function collectLinks() {
  return [...document.querySelectorAll('#editLinks .link-row')]
    .map(row => ({ label: row.querySelector('[data-field="label"]').value.trim(), url: row.querySelector('[data-field="url"]').value.trim() }))
    .filter(lk => lk.url);
}

// ── Calendrier custom ─────────────────────────────────────────────────────────

function openDatePopup(id) {
  editingId = Number(id);
  const d = devoirs.find(x => x.id === editingId);
  if (!d) return;
  const current = new Date(d.date + 'T00:00:00');
  calYear = current.getFullYear();
  calMonth = current.getMonth();
  calSelectedDate = d.date;
  renderCalendar();
  document.getElementById('calSheetOverlay').classList.add('open');
  document.getElementById('calSheet').classList.add('open');
}

function closeDatePopup() {
  document.getElementById('calSheetOverlay').classList.remove('open');
  document.getElementById('calSheet').classList.remove('open');
  editingId = null;
}

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = MONTHS_LABELS[calMonth] + ' ' + calYear;
  const todayStr   = new Date().toISOString().split('T')[0];
  const devoirDates = new Set(devoirs.map(d => d.date));
  let startDow = new Date(calYear, calMonth, 1).getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const container = document.getElementById('calDays');
  container.innerHTML = '';
  for (let i = 0; i < startDow; i++) {
    const e = document.createElement('div'); e.className = 'cal-day other-month'; container.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const btn = document.createElement('button');
    btn.className = 'cal-day'; btn.textContent = d;
    if (dateStr === todayStr)        btn.classList.add('today');
    if (dateStr === calSelectedDate) btn.classList.add('selected');
    if (devoirDates.has(dateStr))    btn.classList.add('has-devoir');
    btn.addEventListener('click', () => {
      const dv = devoirs.find(x => x.id === Number(editingId));
      if (dv) { dv.date = dateStr; save(); render(); }
      closeDatePopup();
    });
    container.appendChild(btn);
  }
  document.getElementById('calPrev').onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };
}

// ── Actions cartes ─────────────────────────────────────────────────────────────

function deleteDevoir(id) {
  devoirs = devoirs.filter(x => x.id !== Number(id));
  save(); render();
}

// ── Rendu ─────────────────────────────────────────────────────────────────────

function render() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('statTotal').textContent  = devoirs.length;
  document.getElementById('statToday').textContent  = devoirs.filter(d => d.date === today).length;
  document.getElementById('statUrgent').textContent = devoirs.filter(d => { const u = urgency(d.date); return u.cls !== 'urgency-later'; }).length;

  // Filtres
  const subjects = [...new Set(devoirs.map(d => d.matiere))];
  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = `<button class="filter-pill ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">Tout</button>`;
  subjects.forEach(s => {
    const active = activeFilter === s;
    const color  = SUBJECT_COLORS[s] || SUBJECT_COLORS.other;
    filtersEl.innerHTML += `<button class="filter-pill ${active?'active':''}" onclick="setFilter('${s}')"
      style="${active ? `border-color:${color};color:${color}` : ''}">${SUBJECT_LABELS[s] || s}</button>`;
  });

  let filtered = activeFilter === 'all' ? devoirs : devoirs.filter(d => d.matiere === activeFilter);
  filtered = [...filtered].sort((a, b) => a.date.localeCompare(b.date));

  const groups = {};
  filtered.forEach(d => { if (!groups[d.date]) groups[d.date] = []; groups[d.date].push(d); });

  const listEl = document.getElementById('devoirsList');
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">📚</div>Aucun devoir.<br>Importe depuis Pronote pour commencer.</div>`;
    return;
  }

  listEl.innerHTML = Object.entries(groups).map(([date, items]) => {
    const u = urgency(date);
    return `
    <div class="day-group">
      <div class="day-label">
        <span class="day-label-text">${formatDateLong(date)}</span>
        ${u.cls !== 'urgency-later' ? `<span class="urgency-badge ${u.cls}">${u.label}</span>` : ''}
      </div>
      <div class="devoirs-list">
        ${items.map(d => {
          const color = SUBJECT_COLORS[d.matiere] || SUBJECT_COLORS.other;
          const dst   = isDST(d.lines);
          const u2    = urgency(d.date);
          return `
          <div class="devoir-card" style="--subject-color:${color}">
            <div class="devoir-check" onclick="deleteDevoir(${d.id})" title="Supprimer">
              <svg class="check-icon" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>
            </div>
            <div>
              <div class="devoir-subject">
                ${escHtml(d.matiereRaw || SUBJECT_LABELS[d.matiere])}
                ${dst ? '<span class="dst-badge">DST</span>' : ''}
              </div>
              <div class="devoir-lines">
                ${d.lines.map(l => `<div class="devoir-line">${escHtml(l)}</div>`).join('')}
              </div>
              ${(d.links && d.links.length) ? `
              <div class="devoir-links">
                ${d.links.map(lk => `
                  <a class="devoir-link-item" href="${escHtml(lk.url)}" target="_blank" rel="noopener">
                    <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                    ${escHtml(lk.label || lk.url)}
                  </a>`).join('')}
              </div>` : ''}
              <div class="card-actions">
                <button class="card-action-btn" onclick="openDatePopup(${d.id})">
                  <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  Déplacer
                </button>
                <button class="card-action-btn" onclick="openEditModal(${d.id})">
                  <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Modifier
                </button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

// ── Init ──────────────────────────────────────────────────────────────────────

document.getElementById('dateToday').textContent = new Date().toLocaleDateString('fr-FR', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});

render();

</script>
